name: Build and Push API to Azure Container Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: acrconnectaimlclub.azurecr.io
          username: acrconnectaimlclub
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            acrconnectaimlclub.azurecr.io/connect-aimlclub-api:v1.6.2
            acrconnectaimlclub.azurecr.io/connect-aimlclub-api:v1.6.0
            acrconnectaimlclub.azurecr.io/connect-aimlclub-api:latest
